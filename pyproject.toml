[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kazi-mcp"
version = "0.1.3"
description = "MCP server for Kenya labor market coordination — job matching, wage benchmarks, skills verification, informal sector registration, and Employment Act rights."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=0.9",
    "pydantic>=2.0",
]
keywords = [
    "mcp","kenya","africa","labor","employment","kazi",
    "east-africa","coordination-infrastructure",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/gabrielmahia/kazi-mcp"
Repository = "https://github.com/gabrielmahia/kazi-mcp"
"Bug Tracker" = "https://github.com/gabrielmahia/kazi-mcp/issues"
Documentation = "https://github.com/gabrielmahia/nairobi-stack"
"MCP Registry" = "https://registry.modelcontextprotocol.io"
Datasets = "https://huggingface.co/gmahia"
Evaluation = "https://github.com/gabrielmahia/kipimo"

[project.scripts]
kazi-mcp = "kazi_mcp.server:mcp.run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kazi_mcp = ["*.json"]
