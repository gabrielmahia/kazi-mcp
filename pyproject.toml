[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kazi-mcp"
version = "0.1.12"
description = "MCP server for Kenya labour market coordination: job matching, wage benchmarks, skills gap analysis, a demo informal-sector registry and Employment Act rights. Demo data; nothing is verified."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=0.9",
    "pydantic>=2.0",
]
keywords = [
    "mcp","kenya","africa","labor","employment","kazi",
    "east-africa","coordination-infrastructure",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries",
]
license-files = ["LICENSE"]

[project.urls]
Homepage = "https://github.com/gabrielmahia/kazi-mcp"
Repository = "https://github.com/gabrielmahia/kazi-mcp"
"Bug Tracker" = "https://github.com/gabrielmahia/kazi-mcp/issues"
Documentation = "https://github.com/gabrielmahia/nairobi-stack"
"MCP Registry" = "https://registry.modelcontextprotocol.io"
Datasets = "https://huggingface.co/gmahia"
Evaluation = "https://github.com/gabrielmahia/kipimo"

[project.scripts]
kazi-mcp = "kazi_mcp.server:mcp.run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kazi_mcp = ["*.json"]
